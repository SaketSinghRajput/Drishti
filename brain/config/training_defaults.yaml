training:
  random_seed: 42
  cv_folds: 5
  test_size: 0.2
  val_size: 0.1
  xgboost:
    objective: 'binary:logistic'
    eval_metric: 'aucpr'
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 200
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    scale_pos_weight: 1.0
    early_stopping_rounds: 20
    verbose_eval: 10
    use_focal_loss: false
    focal_loss_alpha: 0.25
    focal_loss_gamma: 2.0
    tree_method: 'hist'
    n_jobs: -1
  imbalance_strategy: 'weights'
  smote_sampling_strategy: 0.5
  smote_k_neighbors: 5
  feature_selection:
    enabled: false
    method: 'importance'
    top_k_features: 50
    importance_threshold: 0.01
  export_onnx: true
  onnx_opset_version: 14
  shap:
    enabled: true
    num_samples: 100
    plot_top_features: 20
