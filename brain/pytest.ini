[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

addopts = -v --strict-markers --tb=short --cov=data_collection --cov=feature_engineering --cov=models --cov=inference --cov=utils --cov=config --cov-report=html --cov-report=term-missing

[pytest.ini]
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    production: Tests that must pass in production validation (no skips/warnings)
    edge: Tests requiring edge hardware
    requires_data: Tests that require sample data files

filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
