services:
  inference:
    build: 
      context: ../../
      dockerfile: deployment/docker/Dockerfile.pi4
    platform: linux/arm64
    privileged: true
    devices:
      - /dev/can0:/dev/can0:rwm
      - /dev/video0:/dev/video0:rwm
      - /dev/gpiomem:/dev/gpiomem:ro
      - /dev/apex_0:/dev/apex_0:rwm
    volumes:
      - ../../models:/models:ro   # <--- Changed: Go up to find models
      - ../../config:/config:ro   # <--- Changed: Go up to find config
    ports:
      - "5000-5003:5000-5003"
    restart: unless-stopped

  # Monitoring/dashboard service: original project path `../../deployment/monitoring_dashboard`
  # was not present in this workspace which caused `failed to read dockerfile` errors.
  # Provide a lightweight placeholder image so compose succeeds; replace with
  # your dashboard build context when available.
  monitoring:
    image: nginx:alpine
    ports:
      - "5003:5003"
    depends_on:
      - inference
