version: '3.8'
services:
  inference:
    build: .
    platform: linux/arm64
    privileged: true
    devices:
      - /dev/can0:/dev/can0:rwm
      - /dev/video0:/dev/video0:rwm
      - /dev/gpiomem:/dev/gpiomem:ro
      - /dev/apex_0:/dev/apex_0:rwm
    volumes:
      - ./models:/models:ro
      - ./config:/config:ro
    ports:
      - "5000-5003:5000-5003"
    restart: unless-stopped

  monitoring:
    build: ./deployment/monitoring_dashboard
    ports:
      - "5003:5003"
    depends_on:
      - inference
