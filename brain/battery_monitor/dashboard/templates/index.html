<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battery Health Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-dark text-light">
    <div class="container-fluid p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Battery Health Monitor</h1>
        <div id="status" class="text-success">Connected</div>
      </div>

      <div class="row mb-3" id="metrics-cards">
        <div class="col-md-3 col-6 mb-2">
          <div class="card metric-card">
            <div class="card-body">
              <h5 class="card-title">Pack Voltage</h5>
              <p id="pack_voltage" class="card-text display-6">-- V</p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-6 mb-2">
          <div class="card metric-card">
            <div class="card-body">
              <h5 class="card-title">Pack Current</h5>
              <p id="pack_current" class="card-text display-6">-- A</p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-6 mb-2">
          <div class="card metric-card">
            <div class="card-body">
              <h5 class="card-title">SoC</h5>
              <p id="soc" class="card-text display-6">-- %</p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-6 mb-2">
          <div class="card metric-card">
            <div class="card-body">
              <h5 class="card-title">SoH</h5>
              <p id="soh" class="card-text display-6">-- %</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-8 mb-3">
          <div class="card">
            <div class="card-body">
              <h5>Pack Voltage / Current (last 60s)</h5>
              <canvas id="vcChart" height="200"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4 mb-3">
          <div class="card mb-3">
            <div class="card-body">
              <h5>Cell Voltages</h5>
              <canvas id="cellVoltChart" height="200"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <h5>Voltage Diff</h5>
              <p id="voltage_diff" class="display-6">-- V</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
              <div class="card mb-3">
                <div class="card-body">
                  <h5>Cell Temperatures</h5>
                  <canvas id="cellTempChart" height="180"></canvas>
                </div>
              </div>
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <h5>Alert History</h5>
              <table class="table table-dark table-striped" id="alertsTable">
                <thead>
                  <tr><th>Timestamp</th><th>Severity</th><th>Source</th><th>Reason</th><th>Score</th></tr>
                </thead>
                <tbody></tbody>

          <div class="row mb-3">
            <div class="col-lg-8 mb-3">
              <div class="card">
                <div class="card-body">
                  <h5>SoC / SoH Trends (last 60 samples)</h5>
                  <canvas id="socSohChart" height="120"></canvas>
                </div>
              </div>
            </div>
          </div>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/dashboard.js"></script>
  </body>
</html>
