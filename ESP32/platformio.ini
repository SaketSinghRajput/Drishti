[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = bblanchon/ArduinoJson@^6.21.0
build_flags = -DCORE_DEBUG_LEVEL=3 -DARDUINO_LOOP_STACK_SIZE=8192
monitor_filters = esp32_exception_decoder

; Optional ESP32-S3 environment
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.21.0
build_flags = -DBOARD_HAS_PSRAM
